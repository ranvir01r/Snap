<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snap</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0b0b0e;color:#e8e6e3;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;box-sizing:border-box}
#stage{position:relative;width:min(100%,960px)}
canvas#out{width:100%;height:auto;display:block;border-radius:14px;background:#000;cursor:pointer}
#hud{position:absolute;left:12px;top:12px;font-size:14px;background:#000a;padding:6px 10px;border-radius:8px}
#big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:700;pointer-events:none;text-shadow:0 2px 12px #000}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font-size:14px}
button{background:#1d1d24;color:#eee;border:1px solid #333;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer}
button:hover{background:#26262f}
button.primary{background:#e8e6e3;color:#111;border-color:#e8e6e3;font-weight:600}
#meter{width:120px;height:8px;background:#222;border-radius:4px;overflow:hidden}
#meter i{display:block;height:100%;width:0;background:#7cf}
#msg{opacity:.7;font-size:13px;text-align:center;max-width:640px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="out" width="640" height="480"></canvas>
    <div id="hud">Press Start</div>
    <div id="big"></div>
  </div>
  <div class="row">
    <button class="primary" id="start">Start camera</button>
    <button id="calib" disabled>Capture background (3s)</button>
    <button id="snapBtn" disabled>Snap (manual)</button>
  </div>
  <div class="row">
    <label>Snap sensitivity <input type="range" id="sens" min="1" max="10" value="6"></label>
    <div id="meter" title="mic transient level"><i></i></div>
  </div>
  <div id="msg">Tip: first click “Capture background” and step out of frame for 3 seconds so there is a clean scene to reveal when you vanish. Then snap your fingers (or press Space).</div>
</div>
<video id="v" playsinline muted style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none"></video>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const video = $('v'), out = $('out'), hud = $('hud'), big = $('big');
const outCtx = out.getContext('2d');
let W = 640, H = 480;
let camCanvas, camCtx, maskCanvas, maskCtx, outImg;
let mA, thr, bg, bgKnown;
let seg = null, running = false;

// ---------- effect state ----------
const DUST_T = 3.2, ASM_T = 2.8;
let state = 'present';          // present | dusting | gone | assembling
let stateStart = 0, lastT = -1;
let calibAt = 0;

// ---------- particles ----------
const MAXP = 90000;
const sx = new Float32Array(MAXP), sy = new Float32Array(MAXP),
      ex = new Float32Array(MAXP), ey = new Float32Array(MAXP),
      t0 = new Float32Array(MAXP), dur = new Float32Array(MAXP), seed = new Float32Array(MAXP);
const pr = new Uint8Array(MAXP), pg = new Uint8Array(MAXP), pb = new Uint8Array(MAXP), kind = new Uint8Array(MAXP);
let np = 0;
function addP(k, x0, y0, x1, y1, d, r, g, b, now) {
  if (np >= MAXP) return;
  const i = np++;
  sx[i]=x0; sy[i]=y0; ex[i]=x1; ey[i]=y1; t0[i]=now; dur[i]=d;
  pr[i]=r; pg[i]=g; pb[i]=b; kind[i]=k; seed[i]=Math.random()*6.283;
}
function removeP(i) {
  const l = --np;
  if (i === l) return;
  sx[i]=sx[l]; sy[i]=sy[l]; ex[i]=ex[l]; ey[i]=ey[l]; t0[i]=t0[l]; dur[i]=dur[l]; seed[i]=seed[l];
  pr[i]=pr[l]; pg[i]=pg[l]; pb[i]=pb[l]; kind[i]=kind[l];
}

function init(w, h) {
  W = w; H = h;
  out.width = W; out.height = H;
  camCanvas = document.createElement('canvas'); camCanvas.width = W; camCanvas.height = H;
  camCtx = camCanvas.getContext('2d', { willReadFrequently: true });
  maskCanvas = document.createElement('canvas'); maskCanvas.width = W; maskCanvas.height = H;
  maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });
  outImg = outCtx.createImageData(W, H);
  mA = new Uint8Array(W * H);
  bg = new Uint8ClampedArray(W * H * 4);
  bgKnown = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) { bg[i*4]=22; bg[i*4+1]=22; bg[i*4+2]=28; bg[i*4+3]=255; }
  // dissolve-order map: sweeps left -> right with chunky noise
  const bw = Math.ceil(W / 8), bh = Math.ceil(H / 8);
  const nz = new Float32Array(bw * bh).map(Math.random);
  thr = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const n = nz[(y >> 3) * bw + (x >> 3)] * 0.7 + Math.random() * 0.3;
    thr[y * W + x] = Math.min(0.999, 0.7 * (x / W) + 0.3 * n);
  }
}

// ---------- camera + mic ----------
let analyser, abuf, floorLvl = 0.01, lastSnap = 0;
async function startMedia() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    $('msg').textContent = 'Microphone unavailable, so use Space / click / the Snap button instead of a real finger snap.';
  }
  video.srcObject = stream;
  await video.play();
  await new Promise(r => video.videoWidth ? r() : video.addEventListener('loadedmetadata', r, { once: true }));
  const w = 640, h = Math.round(640 * video.videoHeight / video.videoWidth);
  init(w, h);
  if (stream.getAudioTracks().length) {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    await ac.resume();
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser();
    analyser.fftSize = 4096;
    abuf = new Float32Array(analyser.fftSize);
    src.connect(analyser);   // not connected to speakers -> no feedback
    setInterval(listen, 20);
  }
}

function listen() {
  if (!analyser) return;
  analyser.getFloatTimeDomainData(abuf);
  let peak = 0;
  for (let i = 1; i < abuf.length; i++) {
    const d = Math.abs(abuf[i] - abuf[i - 1]);   // crude high-pass: snaps are sharp transients
    if (d > peak) peak = d;
  }
  const s = +$('sens').value;
  const absThr = 0.30 - s * 0.025;
  const trigger = Math.max(absThr, floorLvl * 6);
  $('meter').firstElementChild.style.width = Math.min(100, peak / 0.5 * 100) + '%';
  const now = performance.now();
  if (peak > trigger && now - lastSnap > 1500) { lastSnap = now; snap(); }
  else if (peak < trigger) floorLvl = floorLvl * 0.98 + peak * 0.02;
}

// ---------- the snap ----------
function snap() {
  if (!running) return;
  const now = performance.now();
  if (state === 'present') { state = 'dusting'; stateStart = now; lastT = -1; }
  else if (state === 'gone') { state = 'assembling'; stateStart = now; lastT = -1; }
}

// ---------- per-frame processing ----------
function onResults(res) {
  if (!running) return;
  const now = performance.now();

  maskCtx.clearRect(0, 0, W, H);
  maskCtx.filter = 'blur(6px)';          // softens + slightly dilates the person region
  maskCtx.drawImage(res.segmentationMask, 0, 0, W, H);
  maskCtx.filter = 'none';
  readMask();

  const cam = camCtx.getImageData(0, 0, W, H).data;
  const o = outImg.data;

  if (calibAt) {
    const left = calibAt - now;
    if (left <= 0) {
      bg.set(cam); bgKnown.fill(1); calibAt = 0; big.textContent = '';
      $('msg').textContent = 'Background captured. Snap your fingers!';
    } else big.textContent = Math.ceil(left / 1000);
  }

  const t = (now - stateStart) / 1000;
  const N = W * H;
  for (let i = 0, j = 0; i < N; i++, j += 4) {
    const m = mA[i];
    // keep the clean-background plate fresh wherever no person is present
    if (m < 5) {
      if (bgKnown[i]) {
        bg[j]   += (cam[j]   - bg[j])   * 0.05;
        bg[j+1] += (cam[j+1] - bg[j+1]) * 0.05;
        bg[j+2] += (cam[j+2] - bg[j+2]) * 0.05;
      } else { bg[j]=cam[j]; bg[j+1]=cam[j+1]; bg[j+2]=cam[j+2]; bgKnown[i]=1; }
    }
    let hidden = 0;
    if (state === 'gone') hidden = 1;
    else if (state === 'dusting') hidden = (thr[i] * 0.6 * DUST_T <= t) ? 1 : 0;
    else if (state === 'assembling') hidden = (t < thr[i] * 0.55 * ASM_T + 0.45 * ASM_T) ? 1 : 0;

    let a = m < 20 ? 0 : (m > 110 ? 1 : (m - 20) / 90);
    a *= hidden;
    if (a === 0) { o[j]=cam[j]; o[j+1]=cam[j+1]; o[j+2]=cam[j+2]; }
    else {
      o[j]   = cam[j]   + (bg[j]   - cam[j])   * a;
      o[j+1] = cam[j+1] + (bg[j+1] - cam[j+1]) * a;
      o[j+2] = cam[j+2] + (bg[j+2] - cam[j+2]) * a;
    }
    o[j+3] = 255;
  }

  // spawn particles as each pixel's turn arrives
  if (state === 'dusting' || state === 'assembling') {
    const dusting = state === 'dusting';
    const tSec = now / 1000;
    for (let y = 0; y < H; y += 3) for (let x = 0; x < W; x += 3) {
      const i = y * W + x;
      if (mA[i] < 110) continue;
      const ts = dusting ? thr[i] * 0.6 * DUST_T : thr[i] * 0.55 * ASM_T;
      if (ts >= lastT && ts < t) {
        const j = i * 4;
        const dx = 70 + Math.random() * 280, dy = -(20 + Math.random() * 150);
        if (dusting) addP(0, x, y, x + dx, y + dy, 1.4 + Math.random() * 1.4, cam[j], cam[j+1], cam[j+2], tSec);
        else addP(1, x + dx, y + dy, x, y, 0.45 * ASM_T, cam[j], cam[j+1], cam[j+2], tSec);
      }
    }
    lastT = t;
  }
  if (state === 'dusting' && t >= DUST_T) { state = 'gone'; }
  if (state === 'assembling' && t >= ASM_T) { state = 'present'; }

  drawParticles(o, now / 1000);
  outCtx.putImageData(outImg, 0, 0);

  hud.textContent = state === 'present' ? 'Snap to vanish' :
                    state === 'gone' ? 'Snap to return' :
                    state === 'dusting' ? 'Turning to dust…' : 'Reassembling…';
}

function readMask() {
  const d = maskCtx.getImageData(0, 0, W, H).data;
  if (readMask.useAlpha === undefined) {
    let min = 255;
    for (let i = 3; i < d.length; i += 4 * 97) if (d[i] < min) min = d[i];
    readMask.useAlpha = min < 250;
  }
  const ch = readMask.useAlpha ? 3 : 0;
  for (let i = 0, j = ch; i < W * H; i++, j += 4) mA[i] = d[j];
}

function drawParticles(o, now) {
  for (let k = np - 1; k >= 0; k--) {
    const u = (now - t0[k]) / dur[k];
    if (u >= 1) { removeP(k); continue; }
    let p, al, wob, r = pr[k], g = pg[k], b = pb[k];
    if (kind[k] === 0) {               // dust: drifts away on the wind, greys out, fades
      p = u * (0.35 + 0.65 * u);
      al = Math.pow(1 - u, 1.2);
      wob = Math.sin(seed[k] + now * 5) * 7 * u;
      const c = u * 0.6;
      r += (150 - r) * c; g += (140 - g) * c; b += (128 - b) * c;
    } else {                            // grains flying back in to rebuild the person
      const q = 1 - u;
      p = 1 - q * q * q;
      al = Math.min(1, 0.25 + u * 3);
      wob = Math.sin(seed[k] + now * 6) * 8 * (1 - u);
    }
    const x = (sx[k] + (ex[k] - sx[k]) * p) | 0;
    const y = (sy[k] + (ey[k] - sy[k]) * p + wob) | 0;
    for (let dy = 0; dy < 3; dy++) {
      const yy = y + dy; if (yy < 0 || yy >= H) continue;
      for (let dx = 0; dx < 3; dx++) {
        const xx = x + dx; if (xx < 0 || xx >= W) continue;
        const i = (yy * W + xx) * 4;
        o[i]   += (r - o[i])   * al;
        o[i+1] += (g - o[i+1]) * al;
        o[i+2] += (b - o[i+2]) * al;
      }
    }
  }
}

// ---------- main loop ----------
async function loop() {
  if (!running) return;
  if (video.readyState >= 2) {
    camCtx.save();
    camCtx.translate(W, 0); camCtx.scale(-1, 1);   // mirror like a selfie view
    camCtx.drawImage(video, 0, 0, W, H);
    camCtx.restore();
    try { await seg.send({ image: camCanvas }); } catch (e) { console.error(e); }
  }
  requestAnimationFrame(loop);
}

// ---------- UI ----------
$('start').onclick = async () => {
  $('start').disabled = true; hud.textContent = 'Starting…';
  try {
    await startMedia();
    seg = new SelfieSegmentation({ locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/' + f });
    seg.setOptions({ modelSelection: 1 });
    seg.onResults(onResults);
    running = true;
    $('calib').disabled = false; $('snapBtn').disabled = false;
    loop();
  } catch (e) {
    console.error(e);
    hud.textContent = 'Could not start: ' + (e.message || e.name);
    $('start').disabled = false;
  }
};
$('calib').onclick = () => { calibAt = performance.now() + 3000; $('msg').textContent = 'Step out of frame…'; };
$('snapBtn').onclick = snap;
out.onclick = snap;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); snap(); } });
})();
</script>
</body>
</html>
